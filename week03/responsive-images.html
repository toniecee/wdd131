<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="WDD 131 Responsive Images activity using HTML picture element, art direction and WebP format.">
    <meta name="author" content="Anthony Agbonoga">
    <title>Responsive Images | WDD 131</title>
    <link rel="stylesheet" href="styles/responsive-images.css">
    <title>Document</title>
</head>
<body>
    <header>
    <h1>Responsive Images with Art Direction</h1>
  </header>

  <main>
    <div class="hero">
      <picture>
        <source srcset="images/hero-large.webp" media="(min-width: 1000px)">
        <source srcset="images/hero-medium.webp" media="(min-width: 500px)">
        <img src="images/hero-small.webp" alt="Benin Nigeria Temple" width="500" height="250">
      </picture>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 | WDD 131 | Responsive Images Demonstration</p>
  </footer>
</body>
</html>
