<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progressive Loading Demonstration | Lazy Loading</title>
  <meta name="description" content="WDD 131 Week 04 learning activity demonstrating native lazy loading and CSS fade animations.">
  <meta name="author" content="Anthony Agbonoga">
  <link rel="stylesheet" href="styles/lazyload.css">
  <script src="scripts/lazyload.js" defer></script>
</head>
<body>

  <main>
    <h1>Progressive Image Loading</h1>

    <img src="https://picsum.photos/400/600?random=1" alt="Placeholder portrait image 1" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=2" alt="Placeholder portrait image 2" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=3" alt="Placeholder portrait image 3" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=4" alt="Placeholder portrait image 4" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=5" alt="Placeholder portrait image 5" loading="lazy" width="400" height="600">
    <img src="https://picsum.photos/400/600?random=6" alt="Placeholder portrait image 6" loading="lazy" width="400" height="600">
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> Anthony Agbonoga | Nigeria</p>
    <p id="lastModified"></p>
  </footer>

</body>
</html>
